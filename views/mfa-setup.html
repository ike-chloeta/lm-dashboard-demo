<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MFA Setup | LM Dashboard</title>
    <link rel="stylesheet" href="/auth-assets/login.css" />
  </head>
  <body>
    <main>
      <section class="auth-panel" aria-labelledby="mfa-title">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">LM</div>
          <div>
            <h1 id="mfa-title">Set up MFA</h1>
            <p>Scan the QR code, then enter the six-digit code.</p>
          </div>
        </div>

        <div class="qr-wrap" id="qr-wrap">
          <p id="qr-loading">Loading QR code...</p>
        </div>

        <div class="secret" id="secret"></div>

        <form id="mfa-form">
          <label>
            Verification code
            <input
              name="token"
              autocomplete="one-time-code"
              inputmode="numeric"
              maxlength="8"
              required
              type="text"
            />
          </label>

          <button type="submit">Verify and continue</button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script>
      const form = document.querySelector("#mfa-form");
      const statusEl = document.querySelector("#status");
      const qrWrap = document.querySelector("#qr-wrap");
      const secretEl = document.querySelector("#secret");
      const button = form.querySelector("button");

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      async function postJson(url, body = {}) {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        return data;
      }

      async function loadQrCode() {
        try {
          const data = await postJson("/mfa/setup");
          const image = document.createElement("img");

          image.src = data.qrCode;
          image.alt = "Authenticator QR code";
          qrWrap.replaceChildren(image);

          secretEl.textContent = `Manual key: ${data.secret}`;
          secretEl.classList.add("visible");
          setStatus("");
        } catch (error) {
          qrWrap.replaceChildren();
          setStatus(`${error.message}. Please log in again.`, true);

          const link = document.createElement("a");
          link.href = "/login";
          link.textContent = "Return to login";
          statusEl.append(" ");
          statusEl.append(link);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        setStatus("");

        const formData = new FormData(form);

        try {
          const data = await postJson("/mfa/verify-setup", {
            token: formData.get("token"),
          });

          setStatus(data.message || "MFA registered successfully");
          window.location.assign("/");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          button.disabled = false;
        }
      });

      loadQrCode();
    </script>
  </body>
</html>
