<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | LM Dashboard</title>
    <link rel="stylesheet" href="/auth-assets/login.css" />
  </head>
  <body>
    <main>
      <section class="auth-panel" aria-labelledby="login-title">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">LM</div>
          <div>
            <h1 id="login-title">Log in</h1>
            <p>Access Demo Dashboard.</p>
          </div>
        </div>

        <form id="login-form">
          <label>
            Username
            <input
              name="username"
              autocomplete="username"
              required
              type="text"
            />
          </label>

          <label>
            Password
            <input
              name="password"
              autocomplete="current-password"
              required
              type="password"
            />
          </label>

          <label class="mfa-field">
            MFA code
            <input
              name="token"
              autocomplete="one-time-code"
              inputmode="numeric"
              type="text"
            />
          </label>

          <button type="submit">Log in</button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script>
      const form = document.querySelector("#login-form");
      const statusEl = document.querySelector("#status");
      const button = form.querySelector("button");
      let mfaRequired = false;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        return data;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        setStatus("");

        const formData = new FormData(form);
        const username = formData.get("username");
        const password = formData.get("password");
        const token = formData.get("token");

        try {
          const data = mfaRequired
            ? await postJson("/mfa/login", { token })
            : await postJson("/login", { username, password });

          if (data.mfaRequired) {
            mfaRequired = true;
            form.classList.add("mfa-active");
            form.querySelector("[name='token']").required = true;
            setStatus(data.message);
            return;
          }

          if (data.mfaSetupRequired) {
            window.location.assign("/mfa/setup");
            return;
          }

          if (data.forceMfaReset) {
            window.location.assign("/mfa/setup");
            return;
          }

          setStatus(data.message || "Login successful");
          window.location.assign("/");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
